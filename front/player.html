<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Player Drawing</title>
  <link rel="stylesheet" href="/styles/colors.css" />
  <link rel="stylesheet" href="/styles/player.css" />
</head>
<body>
  <main class="app">
    <section class="draw-area">
      <header class="header">
        <h1 id="player-title">Player</h1>
        <span class="pill" id="category-pill">Category: waiting...</span>
      </header>
      <canvas id="canvas" width="900" height="900"></canvas>
      <div class="controls">
        <button id="ready-btn" type="button">Ready</button>
        <button id="clear-btn" class="secondary" type="button">Clear</button>
        <button id="undo-btn" class="secondary" type="button">Undo Stroke</button>
        <button id="send-btn" type="button">Force Predict</button>
      </div>
      <p class="status" id="network-status">Connecting...</p>
    </section>

    <aside class="side">
      <article class="card">
        <h2>Top Predictions</h2>
        <ol id="predictions" class="prediction-list">
          <li>Draw to start predictions</li>
        </ol>
      </article>
      <article class="card">
        <h2>Round Timer</h2>
        <p id="timer-text">Not running</p>
      </article>
      <article class="card">
        <h2>Tips</h2>
        <p class="status">Use one clear object. Big shapes first, details later.</p>
      </article>
    </aside>
  </main>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="/js/player.js"></script>
</body>
</html>
