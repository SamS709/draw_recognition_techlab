<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Draw Duel Host</title>
  <link rel="stylesheet" href="/styles/colors.css" />
  <link rel="stylesheet" href="/styles/host.css" />
</head>
<body>
  <main class="app">
    <section class="top">
      <h1 class="headline" id="category">Category: waiting...</h1>
      <div class="timer" id="timer">Waiting...</div>
      <h2 class="top-epochs" id="epochs-info">Model epochs: not selected</h2>
    </section>

    <section class="boards">
      <article class="board board-one">
        <header>
          <h2>Player 1</h2>
          <p class="status" id="p1-status">Disconnected - Not Ready</p>
        </header>
        <div class="canvas-wrap">
          <canvas id="canvas-1" width="900" height="900"></canvas>
        </div>
        <div class="player-controls">
          <button id="clear-btn-1" class="secondary" type="button">Clear</button>
          <button id="undo-btn-1" class="secondary" type="button">Undo Stroke</button>
          <button id="send-btn-1" type="button">Force Predict</button>
        </div>
      </article>

      <aside class="pred-column" aria-label="Predictions">
        <div class="pred-stack">
          <div class="pred pred-side pred-side-1"><ol id="pred-1"><li>Waiting for drawing</li></ol></div>
          <div class="pred pred-side pred-side-2"><ol id="pred-2"><li>Waiting for drawing</li></ol></div>
        </div>
      </aside>

      <article class="board board-two">
        <header>
          <h2>Player 2</h2>
          <p class="status" id="p2-status">Disconnected - Not Ready</p>
        </header>
        <div class="canvas-wrap">
          <canvas id="canvas-2" width="900" height="900"></canvas>
        </div>
        <div class="player-controls">
          <button id="clear-btn-2" class="secondary" type="button">Clear</button>
          <button id="undo-btn-2" class="secondary" type="button">Undo Stroke</button>
          <button id="send-btn-2" type="button">Force Predict</button>
        </div>
      </article>
    </section>
  </main>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="/js/host.js"></script>
</body>
</html>
